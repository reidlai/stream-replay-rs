[package]
name = "stream-replay-rs"
version = "0.1.0"
edition = "2021"
authors = ["FerrousCX Contributors"]
description = "Generic streaming traffic replay engine and terminal CLI binary"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = "0.17"
csv = "1.3"
arrow = { version = "53.2", default-features = false, features = ["csv", "ipc"] }
parquet = { version = "53.2", default-features = false, features = ["arrow"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.12"

[features]
default = []
kafka = []
nats = []
fluvio = []
iceoryx2 = []
full = ["kafka", "nats", "fluvio", "iceoryx2"]

[[bin]]
name = "stream-replay-rs"
path = "src/main.rs"

[lib]
name = "stream_replay_rs"
path = "src/lib.rs"

