[package]
name = "stream-replay-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
authors = ["stream-replay-rs contributors"]
description = "Generic event replayer: turns a CSV, Parquet or JSONL dataset into a live stream by rebasing timestamps onto the live clock and pacing by speed or fixed rate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reidlai/stream-replay-rs"
homepage = "https://github.com/reidlai/stream-replay-rs"
documentation = "https://docs.rs/stream-replay-rs"
readme = "README.md"
keywords = ["replay", "streaming", "events", "kafka", "parquet"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
indicatif = "0.17"
csv = "1.3"
arrow = { version = "59.3.2", default-features = false }
parquet = { version = "59.3.2", default-features = false, features = ["arrow"] }
rskafka = { version = "0.6.0", default-features = false }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.12"
# Wire-level fake broker for the Kafka sink tests (no Docker needed)
kafka-protocol = { version = "0.18", default-features = false, features = ["broker"] }
bytes = "1"

[[bin]]
name = "stream-replay-rs"
path = "src/main.rs"

[lib]
name = "stream_replay_rs"
path = "src/lib.rs"

