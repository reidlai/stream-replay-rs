# Cargo Deny Configuration for stream-replay-rs
# Enforces Tier 1 DevSecOps supply-chain assurance and license compliance.

[advisories]
yanked = "warn"
unmaintained = "all"
ignore = [
    "RUSTSEC-2025-0119", # number_prefix unmaintained transitive dependency
    "RUSTSEC-2024-0436", # paste unmaintained transitive dependency
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
